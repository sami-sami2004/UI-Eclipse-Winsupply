<div class="dashboard">
    <app-genre-filter></app-genre-filter>

    <app-book-list></app-book-list>
    <h1 class="dashboardHeading">Bookish Dashboard</h1>
    @if (books.length > 0) {
        <p>Here are the available books</p>
        <ul>
        @for (book of books; track book.id){
            <li>{{book.name}}</li>
        }
        </ul>
    }
    @else {
        <p>No books found.</p>
    }
</div>
