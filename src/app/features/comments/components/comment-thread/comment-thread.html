<section class="comment-thread">
  <h2>Comments</h2>

  <form class="comment-form" (submit)="$event.preventDefault(); addComment()">
    <input
    type="text"
    placeholder="Add a comment..."
    [value]="newCommentText()"
    (input)="onInput($event)"/>
    <button type="submit">Submit</button>
  </form>

  @for (comment of allComments(); track comment.commentId) {
    <app-comment-card [comment]="comment" [number]="$index + 1"></app-comment-card>
  } @empty {
    <p>No comments yet.</p>
  }
</section>
